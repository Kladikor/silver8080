<style>

const KN=['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'],MODES={'Major':[0,2,4,5,7,9,11],'Minor':[0,2,3,5,7,8,10],'Dorian':[0,2,3,5,7,9,10],'Phrygian':[0,1,3,5,7,8,10],'Lydian':[0,2,4,6,7,9,11],'Mixolydian':[0,2,4,5,7,9,10],'Locrian':[0,1,3,5,6,8,10],'Harm. Minor':[0,2,3,5,7,8,11]},MAJS=[0,2,4,5,7,9,11],RN=['I','II','III','IV','V','VI','VII'];

function chordsOf(root,mode,v=cvar){const s=MODES[mode];return chordsOf0(root,mode).map(c=>{const t=c.notes,b=t[0],d=c.d;let nt=t,sf=null;
if(v==1){nt=[b,b+2,t[2]];sf='sus2'}else if(v==2){nt=[b,b+5,t[2]];sf='sus4'}else if(v==3){nt=[...t,b+14];sf={maj:'',min:'m',dim:'dim',aug:'+'}[c.q]+'add9'}

else if(v==5){nt=[b,b+4,b+8];sf='+'}else if(v==6){nt=[b,b+3,b+6];sf='dim'}

function chordsOf0(root,mode){const s=MODES[mode],r0=root>6?root-12:root;return s.map((_,d)=>{const n=[0,2,4].map(k=>{const i=d+k;return s[i%7]+12*Math.floor(i/7)}),a=n[1]-n[0],b=n[2]-n[0],q=a==3?(b==6?'dim':'min'):(b==8?'aug':'maj'),ac=s[d]-MAJS[d];let rn=(ac<0?'b':ac>0?'#':'')+RN[d];if(q=='min'||q=='dim')rn=rn.replace(/[IV]+/,m=>m.toLowerCase());return{d,q,name:KN[(root+s[d])%12]+{maj:'',min:'m',dim:'dim',aug:'+'}[q],rn:rn+(q=='dim'?'\u00b0':q=='aug'?'+':''),notes:n.map(x=>48+r0+x)}})}

function hit(i,g,t,f,ast){const A=ATK[i];if(!A||!A.p)return;const lv=P.alv*g,d=P.adc,out=ctx.createGain();out.connect(bus);out.gain.setValueAtTime(lv,t);out.gain.setTargetAtTime(0,t+.004,d/3);
